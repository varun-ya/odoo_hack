<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GearGuard - Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .signup-box {
      width: 460px;
      padding: 40px;
      border-radius: 18px;
      border: 1px solid #2a2a2a;
      background: linear-gradient(145deg, #0d0d0d, #121212);
    }

    .title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #cfcfcf;
    }

    .form-group input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #555;
      padding: 10px 4px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-bottom-color: #ffffff;
    }

    .signup-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .signup-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    .error {
      margin-top: 15px;
      font-size: 13px;
      color: #ff4d4d;
      text-align: center;
      display: none;
    }

    .success {
      margin-top: 15px;
      font-size: 13px;
      color: #66ff99;
      text-align: center;
      display: none;
    }

    .logout-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #666;
      background: transparent;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      border-color: #ffffff;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="signup-box">
    <div class="title">GearGuard Sign Up</div>

    <form id="signupForm">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label>Email id</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>

      <div class="form-group">
        <label>Re-Enter Password</label>
        <input type="password" id="confirmPassword" required />
      </div>

      <button type="submit" class="signup-btn">Sign Up</button>

      <div class="error" id="errorMsg"></div>
      <div class="success" id="successMsg">Account created successfully</div>
    </form>
    
    <button type="button" class="logout-btn" onclick="logout()">Back to Login</button>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3001/api';
    const form = document.getElementById("signupForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      // Client-side validation
      if (name === "" || email === "" || password === "" || confirmPassword === "") {
        errorMsg.textContent = "All fields are required";
        errorMsg.style.display = "block";
        return;
      }

      // Password match check
      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match";
        errorMsg.style.display = "block";
        return;
      }

      // Password strength validation
      if (password.length < 8) {
        errorMsg.textContent = "Password must be at least 8 characters";
        errorMsg.style.display = "block";
        return;
      }

      const hasLowerCase = /[a-z]/.test(password);
      const hasUpperCase = /[A-Z]/.test(password);
      const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
      
      if (!hasLowerCase || !hasUpperCase || !hasSpecialChar) {
        errorMsg.textContent = "Password must contain uppercase, lowercase, and special character";
        errorMsg.style.display = "block";
        return;
      }

      try {
        console.log('Attempting registration with:', { name, email });
        const response = await fetch(`${API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name,
            email,
            password
          })
        });

        const data = await response.json();
        console.log('Registration response:', response.status, data);

        if (!response.ok) {
          errorMsg.textContent = data.error || "Registration failed";
          errorMsg.style.display = "block";
          return;
        }

        // Save token and user data
        if (data.token) {
          console.log('Registration successful, storing token');
          localStorage.setItem("token", data.token);
          localStorage.setItem("currentUser", JSON.stringify(data.user));
        }

        successMsg.textContent = "Account created successfully! User saved to database.";
        successMsg.style.display = "block";
        form.reset();
        
        // Redirect to dashboard after 2 seconds
        setTimeout(() => {
          window.location.href = "../index.html";
        }, 2000);
      } catch (error) {
        console.error('Registration error:', error);
        errorMsg.textContent = "Network error: " + error.message;
        errorMsg.style.display = "block";
      }
    });

    function logout() {
      // Clear any stored user data
      localStorage.removeItem("token");
      localStorage.removeItem("currentUser");
      
      // Redirect to login page
      window.location.href = "../login/index.html";
    }
  </script>

</body>
</html>
