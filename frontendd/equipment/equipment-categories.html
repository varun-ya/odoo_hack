<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Equipment Categories</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #0b0b0b;
  color: #ffffff;
  padding: 20px;
}

/* ===== WRAPPER ===== */
.wrapper {
  border: 1px solid #333;
  border-radius: 18px;
  padding: 20px;
}

/* ===== TOP BAR ===== */
.top-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.new-btn {
  padding: 6px 16px;
  border-radius: 10px;
  border: 1px solid #ffffff;
  background: transparent;
  color: #ffffff;
  cursor: pointer;
  font-size: 13px;
}

.new-btn:hover {
  background: #ffffff;
  color: #000000;
}

.title {
  font-size: 16px;
}

/* ===== TABLE ===== */
.table-wrap {
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #121212;
}

th, td {
  padding: 14px;
  font-size: 13px;
  text-align: left;
}

th {
  color: #bdbdbd;
  font-weight: 500;
}

tbody tr {
  border-top: 1px dashed #333;
}

tbody tr:hover {
  background: #151515;
}

/* ===== MODAL ===== */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  z-index:1000;
}

.modal-content{
  background:#121212;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  width:400px;
  margin:50px auto;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:5px;
  color:#bdbdbd;
  font-size:13px;
}

.form-group input{
  width:100%;
  padding:8px;
  background:#111;
  border:1px solid #444;
  border-radius:6px;
  color:#fff;
  outline:none;
}

.save-btn{
  padding:8px 16px;
  background:#6aa9ff;
  border:none;
  border-radius:6px;
  color:#000;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="new-btn" onclick="goBack()">Back</button>
    <button class="new-btn" onclick="openModal()">New</button>
    <div class="title">Equipment Categories</div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Responsible</th>
          <th>Company</th>
        </tr>
      </thead>

      <tbody id="categoryTable">
        <tr>
          <td>Computers</td>
          <td>OdooBot</td>
          <td>My Company (San Francisco)</td>
        </tr>

        <tr>
          <td>Software</td>
          <td>OdooBot</td>
          <td>My Company (San Francisco)</td>
        </tr>

        <tr>
          <td>Monitors</td>
          <td>Mitchell Admin</td>
          <td>My Company (San Francisco)</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- MODAL -->
<div id="categoryModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Add Category</h3>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>
    
    <form id="categoryForm">
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" id="categoryName" required>
      </div>
      
      <div class="form-group">
        <label>Responsible</label>
        <input type="text" id="responsible" value="OdooBot">
      </div>
      
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="company" value="My Company (San Francisco)">
      </div>
      
      <button type="submit" class="save-btn">Save</button>
    </form>
  </div>
</div>

<script>
function goBack() {
  window.location.href = 'index.html';
}

function openModal() {
  document.getElementById('modalTitle').textContent = 'Add Category';
  document.getElementById('categoryForm').reset();
  document.getElementById('responsible').value = 'OdooBot';
  document.getElementById('company').value = 'My Company (San Francisco)';
  document.getElementById('categoryModal').style.display = 'block';
}

function closeModal() {
  document.getElementById('categoryModal').style.display = 'none';
}

document.getElementById('categoryForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const formData = {
    name: document.getElementById('categoryName').value,
    responsible: document.getElementById('responsible').value,
    company: document.getElementById('company').value
  };
  
  // Add new row
  const table = document.getElementById('categoryTable');
  const newRow = table.insertRow();
  newRow.innerHTML = `
    <td>${formData.name}</td>
    <td>${formData.responsible}</td>
    <td>${formData.company}</td>
  `;
  
  closeModal();
});

// Close modal when clicking outside
window.onclick = function(event) {
  const modal = document.getElementById('categoryModal');
  if (event.target === modal) {
    closeModal();
  }
}
</script>

</body>
</html>
