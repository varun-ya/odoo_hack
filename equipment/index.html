<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Equipment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  background:#0b0b0b;
  color:#fff;
  padding:20px;
}

/* ===== WRAPPER ===== */
.wrapper{
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
}

/* ===== TOP BAR ===== */
.top-bar{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

.new-btn{
  padding:8px 18px;
  border-radius:10px;
  border:1px solid #fff;
  background:transparent;
  color:#fff;
  cursor:pointer;
}

.new-btn:hover{
  background:#fff;
  color:#000;
}

.search-box{
  display:flex;
  align-items:center;
  background:#f1f1f1;
  border-radius:8px;
  padding:6px 10px;
  width:420px;
}

.search-box input{
  border:none;
  outline:none;
  width:100%;
  background:transparent;
  font-size:14px;
}

/* ===== TABLE ===== */
.table-wrap{
  margin-top:16px;
  border:1px solid #2a2a2a;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:#121212;
}

th, td{
  padding:14px;
  text-align:left;
  font-size:13px;
}

th{
  color:#bdbdbd;
  font-weight:500;
}

tbody tr{
  border-top:1px dashed #333;
  cursor:pointer;
}

tbody tr:hover{
  background:#151515;
}

/* ===== ACTION BUTTONS ===== */
.actions{
  display:flex;
  gap:8px;
}

.edit-btn, .delete-btn{
  padding:4px 8px;
  border-radius:6px;
  border:1px solid;
  background:transparent;
  cursor:pointer;
  font-size:12px;
}

.edit-btn{
  border-color:#6aa9ff;
  color:#6aa9ff;
}

.edit-btn:hover{
  background:#6aa9ff;
  color:#000;
}

.delete-btn{
  border-color:#ff4d4d;
  color:#ff4d4d;
}

.delete-btn:hover{
  background:#ff4d4d;
  color:#000;
}

/* ===== MODAL ===== */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  z-index:1000;
}

.modal-content{
  background:#121212;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  width:500px;
  margin:50px auto;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:5px;
  color:#bdbdbd;
  font-size:13px;
}

.form-group input, .form-group select{
  width:100%;
  padding:8px;
  background:#111;
  border:1px solid #444;
  border-radius:6px;
  color:#fff;
  outline:none;
}

.save-btn{
  padding:8px 16px;
  background:#6aa9ff;
  border:none;
  border-radius:6px;
  color:#000;
  cursor:pointer;
}

/* ===== CATEGORY LINK ===== */
.category-link{
  color:#6aa9ff;
  cursor:pointer;
  text-decoration:underline;
}

.category-link:hover{
  color:#ffffff;
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="new-btn" onclick="goBack()">Back</button>
    <button class="new-btn" onclick="openModal()">New</button>

    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#525151" viewBox="0 0 256 256"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path></svg>
      <input type="text" placeholder="Search..." />
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Equipment Name</th>
          <th>Employee</th>
          <th>Department</th>
          <th>Serial Number</th>
          <th>Technician</th>
          <th>Equipment Category</th>
          <th>Company</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="equipmentTable">
        <tr>
          <td>Samsung Monitor 15"</td>
          <td>Tejas Modi</td>
          <td>Admin</td>
          <td>MT/25/2278</td>
          <td>Mitchell Admin</td>
          <td><span class="category-link" onclick="openCategory('Monitors')">Monitors</span></td>
          <td>My Company (San Francisco)</td>
          <td>
            <div class="actions">
              <button class="edit-btn" onclick="editEquipment(this)">Edit</button>
              <button class="delete-btn" onclick="deleteEquipment(this)">Delete</button>
            </div>
          </td>
        </tr>

        <tr>
          <td>Acer Laptop</td>
          <td>—</td>
          <td>Technician</td>
          <td>MT/122/11112222</td>
          <td>Marc Demo</td>
          <td><span class="category-link" onclick="openCategory('Computers')">Computers</span></td>
          <td>My Company (San Francisco)</td>
          <td>
            <div class="actions">
              <button class="edit-btn" onclick="editEquipment(this)">Edit</button>
              <button class="delete-btn" onclick="deleteEquipment(this)">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- MODAL -->
<div id="equipmentModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Add Equipment</h3>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>
    
    <form id="equipmentForm">
      <div class="form-group">
        <label>Equipment Name</label>
        <input type="text" id="equipmentName" required>
      </div>
      
      <div class="form-group">
        <label>Employee</label>
        <input type="text" id="employee">
      </div>
      
      <div class="form-group">
        <label>Department</label>
        <select id="department">
          <option value="Admin">Admin</option>
          <option value="Technician">Technician</option>
          <option value="Production">Production</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Serial Number</label>
        <input type="text" id="serialNumber" required>
      </div>
      
      <div class="form-group">
        <label>Technician</label>
        <input type="text" id="technician">
      </div>
      
      <div class="form-group">
        <label>Equipment Category</label>
        <select id="category">
          <option value="Computers">Computers</option>
          <option value="Monitors">Monitors</option>
          <option value="Printers">Printers</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="company" value="My Company (San Francisco)">
      </div>
      
      <button type="submit" class="save-btn">Save</button>
    </form>
  </div>
</div>

<script>
let editingRow = null;

function openModal() {
  document.getElementById('modalTitle').textContent = 'Add Equipment';
  document.getElementById('equipmentForm').reset();
  document.getElementById('company').value = 'My Company (San Francisco)';
  editingRow = null;
  document.getElementById('equipmentModal').style.display = 'block';
}

function closeModal() {
  document.getElementById('equipmentModal').style.display = 'none';
}

function editEquipment(btn) {
  const row = btn.closest('tr');
  const cells = row.cells;
  
  // Store equipment data for detail page
  const equipmentData = {
    name: cells[0].textContent,
    employee: cells[1].textContent,
    department: cells[2].textContent,
    serial: cells[3].textContent,
    technician: cells[4].textContent,
    category: cells[5].textContent,
    company: cells[6].textContent
  };
  
  localStorage.setItem('selectedEquipmentData', JSON.stringify(equipmentData));
  window.location.href = 'equipment-detail.html';
}

function deleteEquipment(btn) {
  if (confirm('Are you sure you want to delete this equipment?')) {
    const row = btn.closest('tr');
    const equipmentName = row.cells[0].textContent;
    
    // Remove from equipment list
    const equipmentList = JSON.parse(localStorage.getItem('equipmentList')) || [];
    const index = equipmentList.indexOf(equipmentName);
    if (index > -1) {
      equipmentList.splice(index, 1);
      localStorage.setItem('equipmentList', JSON.stringify(equipmentList));
    }
    
    row.remove();
  }
}

document.getElementById('equipmentForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const formData = {
    name: document.getElementById('equipmentName').value,
    employee: document.getElementById('employee').value || '—',
    department: document.getElementById('department').value,
    serial: document.getElementById('serialNumber').value,
    technician: document.getElementById('technician').value,
    category: document.getElementById('category').value,
    company: document.getElementById('company').value
  };
  
  // Update equipment list in localStorage
  const equipmentList = JSON.parse(localStorage.getItem('equipmentList')) || ['Samsung Monitor 15"', 'Acer Laptop'];
  
  if (editingRow) {
    // Update existing row
    const oldName = editingRow.cells[0].textContent;
    const index = equipmentList.indexOf(oldName);
    if (index > -1) {
      equipmentList[index] = formData.name;
    }
    
    editingRow.cells[0].textContent = formData.name;
    editingRow.cells[1].textContent = formData.employee;
    editingRow.cells[2].textContent = formData.department;
    editingRow.cells[3].textContent = formData.serial;
    editingRow.cells[4].textContent = formData.technician;
    editingRow.cells[5].textContent = formData.category;
    editingRow.cells[6].textContent = formData.company;
  } else {
    // Add new equipment to list
    equipmentList.push(formData.name);
    
    // Add new row
    const table = document.getElementById('equipmentTable');
    const newRow = table.insertRow();
    newRow.innerHTML = `
      <td>${formData.name}</td>
      <td>${formData.employee}</td>
      <td>${formData.department}</td>
      <td>${formData.serial}</td>
      <td>${formData.technician}</td>
      <td><span class="category-link" onclick="openCategory('${formData.category}')">${formData.category}</span></td>
      <td>${formData.company}</td>
      <td>
        <div class="actions">
          <button class="edit-btn" onclick="editEquipment(this)">Edit</button>
          <button class="delete-btn" onclick="deleteEquipment(this)">Delete</button>
        </div>
      </td>
    `;
  }
  
  // Save updated equipment list
  localStorage.setItem('equipmentList', JSON.stringify(equipmentList));
  
  closeModal();
});

// Close modal when clicking outside
window.onclick = function(event) {
  const modal = document.getElementById('equipmentModal');
  if (event.target === modal) {
    closeModal();
  }
}

function goBack() {
  window.location.href = '../index.html';
}

function openCategory(categoryName) {
  localStorage.setItem('selectedCategory', categoryName);
  window.location.href = 'equipment-categories.html';
}
</script>

</body>
</html>
