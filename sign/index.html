<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GearGuard - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .login-box {
      width: 420px;
      padding: 40px;
      border-radius: 18px;
      border: 1px solid #2a2a2a;
      background: linear-gradient(145deg, #0d0d0d, #121212);
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 26px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #cfcfcf;
    }

    .form-group input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #555;
      padding: 10px 4px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-bottom-color: #ffffff;
    }

    .login-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }

    .links a {
      color: #6aa9ff;
      text-decoration: none;
      margin: 0 5px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error-message {
      margin-top: 15px;
      color: #ff4d4d;
      font-size: 13px;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="login-title">GearGuard Login</div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email id</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit" class="login-btn">Sign In</button>

      <div class="error-message" id="errorMsg">
        Invalid credentials
      </div>

      <div class="links">
        <a href="#">Forget Password ?</a> |
        <a href="../signup/index.html">Sign Up</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      // Validate with localStorage users
      if (email === "" || password === "") {
        errorMsg.textContent = "All fields are required";
        errorMsg.style.display = "block";
        return;
      }

      const users = JSON.parse(localStorage.getItem("portalUsers")) || [];
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        errorMsg.textContent = "Invalid email or password";
        errorMsg.style.display = "block";
        return;
      }

      // Success - Store session and redirect
      errorMsg.style.display = "none";
      localStorage.setItem("currentUser", JSON.stringify(user));
      window.location.href = "../index.html";
    });
  </script>

</body>
</html>
